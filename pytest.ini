[pytest]
addopts = -ra
testpaths = tests
norecursedirs = .git ai_trainer_env archived .playwright-cli .playwright-mcp logs
markers =
    smoke: contributor-safe smoke tests that should pass in a normal local setup
    live: tests that require live external systems, credentials, or network access
    debug: diagnostics and exploratory tests that are not part of the default contributor path
    e2e: сквозные браузерные тесты web-стека (FastAPI + Next.js, Playwright); запускать отдельно: python -m pytest -m e2e tests/e2e -q
