name: Codex watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Check stalled queued issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const TIMEOUT_MS = 30 * 60 * 1000; // 30 min
            const now = Date.now();

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'status: queued,agent: codex',
              state: 'open',
            });

            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
            });

            for (const issue of issues) {
              // Find youngest @codex ping
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });

              const pings = comments.filter(c => c.body.includes('@codex'));
              if (!pings.length) continue;

              const lastPing = pings[pings.length - 1];
              const age = now - new Date(lastPing.created_at).getTime();
              if (age < TIMEOUT_MS) continue;

              // Check if a linked PR exists
              const linked = allPRs.some(pr => {
                const body = pr.body || '';
                const ref  = pr.head.ref || '';
                return (
                  body.match(new RegExp(`(?:closes|fixes|resolves)\\s+#${issue.number}\\b`, 'i')) ||
                  ref.startsWith('codex/')
                );
              });

              if (linked) {
                // PR exists — mark in progress
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['status: in progress'],
                });
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'status: queued',
                  });
                } catch {}
              } else {
                // No PR — mark blocked and re-ping
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['status: blocked'],
                });
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'status: queued',
                  });
                } catch {}
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: [
                    `⚠️ **Watchdog**: @codex was pinged 30+ minutes ago but no PR appeared.`,
                    ``,
                    `@codex please retry — implement the task described in the first comment above.`,
                  ].join('\n'),
                });
              }
            }
