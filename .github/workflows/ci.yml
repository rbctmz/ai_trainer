name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contributor-safe-tests:
    name: Contributor-safe pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run contributor-safe tests
        run: >
          python -m pytest
          -m "not live and not debug"
          tests/
          -W error::pytest.PytestReturnNotNoneWarning

  web-contract:
    name: Web contract artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tests/conftest.py импортирует config.settings.Settings → нужен python-dotenv.
      - name: Install minimal test dependencies
        run: python -m pip install pytest python-dotenv

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Check contract artifact freshness
        run: npm --prefix web run contract:extract -- --check

      - name: Run contract tests
        run: >
          python -m pytest
          tests/smoke/test_contract_extractor.py
          tests/smoke/test_api_call_inventory.py
          -q
