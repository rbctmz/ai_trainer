name: Codex auto-assign

on:
  issues:
    types: [opened]

jobs:
  assign-codex:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.body, '### ExecPlan')
    steps:
      - name: Post Codex task comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title;

            const extract = (label) => {
              const m = body.match(new RegExp(`### ${label}\\n+([\\s\\S]+?)(?=\\n###|$)`));
              return m ? m[1].trim() : '_see issue body_';
            };

            const execplan   = extract('ExecPlan');
            const acceptance = extract('Acceptance criteria');
            const smoke      = extract('Smoke baseline');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                `@codex Please implement this task: **${title}**`,
                ``,
                `**ExecPlan:** ${execplan}`,
                ``,
                `**Acceptance criteria:**`,
                acceptance,
                ``,
                `**Smoke baseline:** ${smoke} — do not regress.`,
                ``,
                `See \`AGENTS.md\` and \`.agent/PLANS.md\` for project conventions.`,
              ].join('\n')
            });
