name: Codex auto-assign

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  assign-codex:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Queue Codex task
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;

            const body = issue.body || '';
            const extract = (label) => {
              const m = body.match(new RegExp(`### ${label}\\n+([\\s\\S]+?)(?=\\n###|$)`));
              return m ? m[1].trim() : '';
            };

            const recognizedChangeClasses = new Set([
              'Class A — Full',
              'Class B — Standard',
              'Class C — Fast track',
            ]);
            const changeClassMatch = body.match(
              /### Change Class\n+([\s\S]+?)(?=\n###|$)/
            );
            const changeClass = changeClassMatch ? changeClassMatch[1].trim() : '';
            if (!recognizedChangeClasses.has(changeClass)) return;

            const execplan   = extract('ExecPlan');
            const nonGoals   = extract('Non-goals');
            const acceptance = extract('Acceptance criteria');
            const smoke      = extract('Smoke baseline');
            const requiredSections = [execplan, nonGoals, acceptance, smoke];
            if (requiredSections.some(value => !value)) return;

            const stripLeadingMarkdown = (value) => value
              .trim()
              .replace(/^(?:(?:[-*+>]|\d+[.)])\s+)*/, '')
              .replace(/^[*_`~]+/, '');
            const naMatch = (value) => stripLeadingMarkdown(value)
              .match(/^N\s*\/?\s*A\b(.*)$/i);
            const isNA = (value) => Boolean(naMatch(value));
            const hasNARationale = (value) => {
              const match = naMatch(value);
              if (!match) return true;
              return match[1]
                .replace(/^[\s:;,.—–\-*_`~]+/, '')
                .trim()
                .length > 0;
            };
            if (
              changeClass === 'Class A — Full' &&
              (isNA(execplan) || isNA(nonGoals))
            ) return;
            if (
              changeClass !== 'Class A — Full' &&
              (!hasNARationale(execplan) || !hasNARationale(nonGoals))
            ) return;

            const isIssueEvent = context.eventName === 'issues';
            const isCommentEvent = context.eventName === 'issue_comment';
            const action = context.payload.action;

            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const ignoredActors = new Set(['github-actions[bot]', 'chatgpt-codex-connector[bot]']);

            let shouldQueue = false;
            if (isIssueEvent && ['opened', 'reopened'].includes(action)) {
              shouldQueue = true;
            } else if (isCommentEvent) {
              const comment = context.payload.comment || {};
              const commentBody = comment.body || '';
              const actor = comment.user?.login || '';
              const association = comment.author_association || '';
              shouldQueue =
                trustedAssociations.has(association) &&
                !ignoredActors.has(actor) &&
                /@codex\b/i.test(commentBody);
            }

            if (!shouldQueue) return;

            const title = issue.title;
            const issueNumber = issue.number;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}.git`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `@codex Please implement this task: **${title}**`,
                ``,
                `**Change class:** ${changeClass}`,
                `Class A requires an ExecPlan. Class B/C may use N/A with a short rationale; reclassify if scope grows.`,
                ``,
                `**ExecPlan:** ${execplan}`,
                ``,
                `**Non-goals:**`,
                nonGoals,
                ``,
                `**Acceptance criteria:**`,
                acceptance,
                ``,
                `**Smoke baseline:** ${smoke} — do not regress.`,
                ``,
                `Publish preflight before you spend more time or create local-only delivery artifacts:`,
                `- ensure the working branch name contains \`issue-${issueNumber}\``,
                `- run \`git remote get-url origin\`; if it fails or points somewhere else, set \`origin\` to \`${repoUrl}\``,
                `- if \`gh\` is available, run \`gh auth status\` and \`gh auth setup-git\` before the first push`,
                `- verify a real publish path exists before finishing: \`git ls-remote --heads origin\` or an equivalent GitHub-native branch/PR path`,
                `- if publish preflight fails, stop immediately and report a summary line that starts with \`Publish preflight blocker:\` plus the exact cause; do not claim success and do not leave local-only delivery as "done"`,
                ``,
                `Required delivery before reporting success:`,
                `- keep working on a branch name that contains \`issue-${issueNumber}\``,
                `- push that branch to \`origin\``,
                `- open a PR against \`main\``,
                `- include \`Closes #${issueNumber}\` in the PR body`,
                `- include the real PR URL and pushed commit SHA in your final issue comment`,
                ``,
                `Do not report success until the PR exists on GitHub.`,
                ``,
                `See \`AGENTS.md\` and \`.agent/PLANS.md\` for project conventions.`,
              ].join('\n')
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['status: queued', 'agent: codex']
            });
            for (const name of ['status: needs triage', 'status: blocked', 'status: in progress']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name
                });
              } catch {}
            }
