name: Codex CI failure loop

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  reping-failed-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on failed PR CI
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const FAILURE_CONCLUSIONS = new Set(['failure', 'timed_out', 'action_required']);
            const run = context.payload.workflow_run;
            if (!FAILURE_CONCLUSIONS.has(run.conclusion || '')) {
              core.info(`Workflow run conclusion is ${run.conclusion}; no CI failure comment needed.`);
              return;
            }

            const marker = `<!-- codex-ci-failure:${run.id} -->`;

            const issueNumbersFromPr = (pr) => {
              const issueNums = new Set();
              const body = pr.body || '';
              const title = pr.title || '';
              const branch = pr.head?.ref || '';
              for (const match of body.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/gi)) {
                issueNums.add(parseInt(match[1], 10));
              }
              for (const match of title.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/gi)) {
                issueNums.add(parseInt(match[1], 10));
              }
              for (const match of branch.matchAll(/(?:^|[\/_-])issue[\/_-]?(\d+)(?:$|[\/_-])/gi)) {
                issueNums.add(parseInt(match[1], 10));
              }
              return [...issueNums];
            };

            const getPrNumbers = async () => {
              const nums = new Set();
              for (const pr of run.pull_requests || []) {
                if (pr.number) nums.add(pr.number);
              }
              if (nums.size === 0 && run.head_branch) {
                const { data: prs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: `${context.repo.owner}:${run.head_branch}`,
                  per_page: 20,
                });
                for (const pr of prs) nums.add(pr.number);
              }
              return [...nums];
            };

            const getPr = async (prNumber) => {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              return pr;
            };

            const issueHasCodexAgent = async (issueNumber) => {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                const labels = new Set((issue.labels || []).map(label =>
                  typeof label === 'string' ? label : label.name
                ));
                return labels.has('agent: codex');
              } catch (error) {
                core.warning(`Unable to inspect linked issue #${issueNumber}: ${error.message}`);
                return false;
              }
            };

            const isAgentOwned = async (pr) => {
              if ((pr.head?.ref || '').startsWith('codex/')) return true;
              const issueNums = issueNumbersFromPr(pr);
              for (const issueNumber of issueNums) {
                if (await issueHasCodexAgent(issueNumber)) return true;
              }
              return false;
            };

            const failedJobs = async () => {
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100,
                });
                return jobs.filter(job => FAILURE_CONCLUSIONS.has(job.conclusion || ''));
              } catch (error) {
                core.warning(`Unable to list failed jobs for workflow run ${run.id}: ${error.message}`);
                return [];
              }
            };

            const hasExistingComment = async (prNumber) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              return comments.some(comment => (comment.body || '').includes(marker));
            };

            const prNumbers = await getPrNumbers();
            core.info(`Failed workflow run ${run.id}; related PRs: ${prNumbers.join(', ') || '(none)'}`);
            const jobs = await failedJobs();
            const jobLines = jobs.length > 0
              ? jobs.map(job => `- ${job.name}: \`${job.conclusion}\`${job.html_url ? ` - ${job.html_url}` : ''}`)
              : ['- Failed job details were not available from the Actions API.'];

            for (const prNumber of prNumbers) {
              const pr = await getPr(prNumber);
              if (pr.state !== 'open') {
                core.info(`PR #${prNumber} is not open; skipping.`);
                continue;
              }
              if (await hasExistingComment(prNumber)) {
                core.info(`PR #${prNumber} already has a comment for workflow run ${run.id}; skipping.`);
                continue;
              }

              const agentOwned = await isAgentOwned(pr);
              const codexLine = agentOwned
                ? '@codex please continue from this failed CI run, inspect the failing job, push a fix to this PR branch, and report the new commit SHA.'
                : 'No Codex ping was added because this PR is not marked as agent-owned.';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: [
                  marker,
                  `**CI failure detected**`,
                  ``,
                  `Workflow: **${run.name}**`,
                  `Run: [${run.display_title || `${run.name} #${run.run_number}`}](${run.html_url})`,
                  `Conclusion: \`${run.conclusion}\``,
                  ``,
                  `Failed jobs:`,
                  ...jobLines,
                  ``,
                  codexLine,
                ].join('\n'),
              });
              core.info(`Posted CI failure comment to PR #${prNumber}.`);
            }
