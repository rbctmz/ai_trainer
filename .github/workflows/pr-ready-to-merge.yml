name: PR ready to merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["CI", "Link PR to issue", "Project roadmap sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number. Leave empty to recompute all open PRs."
        required: false
  schedule:
    - cron: "*/15 * * * *"

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  review-gate:
    name: Review gate
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'pull_request_review' ||
       github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enforce accepted bounded review
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {
              MAX_NATIVE_REVIEW_ROUNDS,
              countNativeReviewRounds,
              evaluateReviewGate,
              isPrivilegedRepositoryPermission,
              latestLabelActor,
              shouldInvalidateAcceptance,
            } = require('./.github/scripts/review-gate.cjs');

            const ACCEPTED_LABEL = 'status: review accepted';
            const READY_LABEL = 'status: ready to merge';
            const EXCEEDED_LABEL = 'status: review budget exceeded';
            const EXCEPTION_LABEL = 'review-budget-exception';
            const pr = context.payload.pull_request;

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            };

            const labels = async () => {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              return new Set((issue.labels || []).map(label =>
                typeof label === 'string' ? label : label.name
              ));
            };

            const issueEvents = async () => github.paginate(
              github.rest.issues.listEventsForTimeline,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              },
            );

            const addLabel = async (name) => {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [name],
              });
            };

            const removeLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            const permissionByActor = new Map();
            const isPrivilegedActor = async (login) => {
              if (!login || login.endsWith('[bot]')) return false;
              if (login === context.payload.repository.owner.login) return true;
              if (!permissionByActor.has(login)) {
                permissionByActor.set(login, (async () => {
                  try {
                    const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      username: login,
                    });
                    return isPrivilegedRepositoryPermission(data.permission);
                  } catch (error) {
                    core.warning(`Cannot authenticate label actor ${login}: ${error.message}`);
                    return false;
                  }
                })());
              }
              return permissionByActor.get(login);
            };

            const authenticatedLabel = async (name, currentLabels, events) => {
              if (!currentLabels.has(name)) return false;
              const actor = context.eventName === 'pull_request' &&
                  context.payload.action === 'labeled' &&
                  context.payload.label?.name === name
                ? context.actor
                : latestLabelActor(events, name);
              const authenticated = await isPrivilegedActor(actor);
              if (!authenticated) core.warning(`${name} has no privileged current actor`);
              return authenticated;
            };

            const reviewSnapshot = async () => {
              let after = null;
              let count = 0;
              let reviewDecision = null;
              do {
                const data = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewDecision
                        reviewThreads(first: 100, after: $after) {
                          nodes { isResolved }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pr.number,
                  after,
                });
                const pullRequest = data.repository.pullRequest;
                const threads = pullRequest.reviewThreads;
                reviewDecision = pullRequest.reviewDecision;
                count += threads.nodes.filter(thread => !thread.isResolved).length;
                after = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (after);
              return { unresolvedThreads: count, reviewDecision };
            };

            await Promise.all([
              ensureLabel(ACCEPTED_LABEL, '1D76DB', 'Merge owner accepted review for the current head; cleared by every push'),
              ensureLabel(EXCEEDED_LABEL, 'D93F0B', `Native review exceeded ${MAX_NATIVE_REVIEW_ROUNDS} rounds without an exception`),
              ensureLabel(EXCEPTION_LABEL, 'BFDADC', 'Merge owner approved a documented exception to the native review budget'),
            ]);

            if (shouldInvalidateAcceptance(context.eventName, context.payload.action)) {
              await Promise.all([removeLabel(ACCEPTED_LABEL), removeLabel(READY_LABEL)]);
            }

            const [currentLabels, reviews, review, events] = await Promise.all([
              labels(),
              github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }),
              reviewSnapshot(),
              issueEvents(),
            ]);
            const nativeReviewRounds = countNativeReviewRounds(reviews);
            const [accepted, hasBudgetException] = await Promise.all([
              authenticatedLabel(ACCEPTED_LABEL, currentLabels, events),
              authenticatedLabel(EXCEPTION_LABEL, currentLabels, events),
            ]);
            const budgetExceeded = nativeReviewRounds > MAX_NATIVE_REVIEW_ROUNDS && !hasBudgetException;

            if (budgetExceeded && !currentLabels.has(EXCEEDED_LABEL)) await addLabel(EXCEEDED_LABEL);
            if (!budgetExceeded && currentLabels.has(EXCEEDED_LABEL)) await removeLabel(EXCEEDED_LABEL);

            const decision = evaluateReviewGate({
              accepted,
              nativeReviewRounds,
              unresolvedThreads: review.unresolvedThreads,
              hasBudgetException,
              reviewDecision: review.reviewDecision,
            });
            await core.summary
              .addHeading('Review gate')
              .addRaw(`PR #${pr.number}: ${decision.reason}`)
              .write();
            if (!decision.ready) core.setFailed(decision.reason);

  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Project PR readiness into labels
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {
              MAX_NATIVE_REVIEW_ROUNDS,
              READY_MARKER,
              countNativeReviewRounds,
              evaluateReviewGate,
              isPrivilegedRepositoryPermission,
              latestLabelActor,
              selectReadinessStatusComments,
              shouldInvalidateAcceptance,
            } = require('./.github/scripts/review-gate.cjs');

            const READY_LABEL = 'status: ready to merge';
            const ACCEPTED_LABEL = 'status: review accepted';
            const EXCEEDED_LABEL = 'status: review budget exceeded';
            const EXCEPTION_LABEL = 'review-budget-exception';
            const OK_CONCLUSIONS = new Set(['success', 'skipped', 'neutral']);
            const IGNORED_CHECK_NAMES = new Set(['ready-to-merge', 'Review gate']);

            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const issueNumbersFromPr = (pr) => {
              const issueNums = new Set();
              const body = pr.body || '';
              const title = pr.title || '';
              const branch = pr.head?.ref || '';
              for (const match of body.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/gi)) {
                issueNums.add(parseInt(match[1], 10));
              }
              for (const match of title.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/gi)) {
                issueNums.add(parseInt(match[1], 10));
              }
              for (const match of branch.matchAll(/(?:^|[\/_-])issue[\/_-]?(\d+)(?:$|[\/_-])/gi)) {
                issueNums.add(parseInt(match[1], 10));
              }
              return [...issueNums];
            };

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            };

            const currentLabels = async (prNumber) => {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              return new Set((issue.labels || []).map(label =>
                typeof label === 'string' ? label : label.name
              ));
            };

            const issueEvents = async (prNumber) => github.paginate(
              github.rest.issues.listEventsForTimeline,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              },
            );

            const addLabel = async (prNumber, name) => {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [name],
              });
            };

            const removeLabel = async (prNumber, name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            const permissionByActor = new Map();
            const isPrivilegedActor = async (login) => {
              if (!login || login.endsWith('[bot]')) return false;
              if (login === context.payload.repository.owner.login) return true;
              if (!permissionByActor.has(login)) {
                permissionByActor.set(login, (async () => {
                  try {
                    const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      username: login,
                    });
                    return isPrivilegedRepositoryPermission(data.permission);
                  } catch (error) {
                    core.warning(`Cannot authenticate label actor ${login}: ${error.message}`);
                    return false;
                  }
                })());
              }
              return permissionByActor.get(login);
            };

            const authenticatedLabel = async (name, labels, events) => {
              if (!labels.has(name)) return false;
              const actor = context.eventName === 'pull_request' &&
                  context.payload.action === 'labeled' &&
                  context.payload.label?.name === name
                ? context.actor
                : latestLabelActor(events, name);
              const authenticated = await isPrivilegedActor(actor);
              if (!authenticated) core.warning(`${name} has no privileged current actor`);
              return authenticated;
            };

            const getPrNumbers = async () => {
              const nums = new Set();
              const pullRequestEvents = new Set([
                'pull_request',
                'pull_request_review',
                'pull_request_review_comment',
              ]);

              if (pullRequestEvents.has(context.eventName)) {
                nums.add(context.payload.pull_request.number);
              } else if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run;
                for (const pr of run.pull_requests || []) {
                  if (pr.number) nums.add(pr.number);
                }
                if (nums.size === 0 && run.head_branch) {
                  const { data: prs } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    head: `${context.repo.owner}:${run.head_branch}`,
                    per_page: 20,
                  });
                  for (const pr of prs) nums.add(pr.number);
                }
              } else if (['workflow_dispatch', 'schedule'].includes(context.eventName)) {
                const input = context.eventName === 'workflow_dispatch'
                  ? (context.payload.inputs?.pr || '').trim()
                  : '';
                if (input) {
                  nums.add(parseInt(input, 10));
                } else {
                  const prs = await github.paginate(github.rest.pulls.list, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    per_page: 100,
                  });
                  for (const pr of prs) nums.add(pr.number);
                }
              }

              return [...nums].filter(Number.isFinite);
            };

            const getPr = async (prNumber) => {
              let { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              if (pr.mergeable === null) {
                await sleep(2000);
                ({ data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                }));
              }
              return pr;
            };

            const checkState = async (pr) => {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const relevant = (data.check_runs || []).filter(run =>
                !IGNORED_CHECK_NAMES.has(run.name)
              );
              if (relevant.length === 0) {
                return { ready: false, reason: 'no current-head check runs found' };
              }
              const pending = relevant.filter(run => run.status !== 'completed');
              if (pending.length > 0) {
                return {
                  ready: false,
                  reason: `pending checks: ${pending.map(run => run.name).join(', ')}`,
                };
              }
              const failing = relevant.filter(run => !OK_CONCLUSIONS.has(run.conclusion || ''));
              if (failing.length > 0) {
                return {
                  ready: false,
                  reason: `non-green checks: ${failing.map(run => `${run.name}=${run.conclusion}`).join(', ')}`,
                };
              }
              return { ready: true, reason: `${relevant.length} check runs green` };
            };

            const reviewState = async (pr, labels) => {
              const reviewsPromise = github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const eventsPromise = issueEvents(pr.number);
              let after = null;
              let unresolvedThreads = 0;
              let reviewDecision = null;
              do {
                const data = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewDecision
                        reviewThreads(first: 100, after: $after) {
                          nodes { isResolved }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: pr.number,
                  after,
                });
                const pullRequest = data.repository.pullRequest;
                const threads = pullRequest.reviewThreads;
                reviewDecision = pullRequest.reviewDecision;
                unresolvedThreads += threads.nodes.filter(thread => !thread.isResolved).length;
                after = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (after);

              const [reviews, events] = await Promise.all([reviewsPromise, eventsPromise]);
              const nativeReviewRounds = countNativeReviewRounds(reviews);
              const [accepted, hasBudgetException] = await Promise.all([
                authenticatedLabel(ACCEPTED_LABEL, labels, events),
                authenticatedLabel(EXCEPTION_LABEL, labels, events),
              ]);
              return {
                decision: evaluateReviewGate({
                  accepted,
                  nativeReviewRounds,
                  unresolvedThreads,
                  hasBudgetException,
                  reviewDecision,
                }),
                budgetExceeded: nativeReviewRounds > MAX_NATIVE_REVIEW_ROUNDS && !hasBudgetException,
              };
            };

            const updateReadyComment = async (pr, issueNums, ready, reason) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const { canonical, duplicates } = selectReadinessStatusComments(comments);
              if (!ready && !canonical) return;

              const issueText = issueNums.map(num => `#${num}`).join(', ');
              const body = [
                READY_MARKER,
                ready ? '**Ready to merge**' : '**Not ready to merge**',
                '',
                ready
                  ? `Linked to ${issueText}; checks and the accepted review gate are green on \`${pr.head.sha.slice(0, 12)}\`.`
                  : `Current head \`${pr.head.sha.slice(0, 12)}\` is not ready: ${reason}.`,
                '',
                'Human merge decision is still required.',
              ].join('\n');
              if (canonical) {
                if ((canonical.body || '') !== body) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: canonical.id,
                    body,
                  });
                }
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }

              const supersededBody = [
                '<!-- pr-ready-to-merge-superseded -->',
                '**Superseded readiness status**',
                '',
                'This legacy per-head signal was replaced by the current readiness comment.',
              ].join('\n');
              for (const duplicate of duplicates) {
                if ((duplicate.body || '') === supersededBody) continue;
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: duplicate.id,
                  body: supersededBody,
                });
              }
            };

            await Promise.all([
              ensureLabel(READY_LABEL, '0E8A16', 'Checks and the accepted bounded review gate are green for the current head'),
              ensureLabel(ACCEPTED_LABEL, '1D76DB', 'Merge owner accepted review for the current head; cleared by every push'),
              ensureLabel(EXCEEDED_LABEL, 'D93F0B', `Native review exceeded ${MAX_NATIVE_REVIEW_ROUNDS} rounds without an exception`),
              ensureLabel(EXCEPTION_LABEL, 'BFDADC', 'Merge owner approved a documented exception to the native review budget'),
            ]);

            const prNumbers = await getPrNumbers();
            core.info(`Evaluating PRs: ${prNumbers.join(', ') || '(none)'}`);
            for (const prNumber of prNumbers) {
              const pr = await getPr(prNumber);
              if (shouldInvalidateAcceptance(context.eventName, context.payload.action)) {
                await Promise.all([
                  removeLabel(prNumber, ACCEPTED_LABEL),
                  removeLabel(prNumber, READY_LABEL),
                ]);
              }
              const labels = await currentLabels(prNumber);
              const issueNums = issueNumbersFromPr(pr);
              let reason = '';

              if (pr.state !== 'open') {
                reason = 'PR is not open';
              } else if (pr.draft) {
                reason = 'PR is draft';
              } else if (issueNums.length === 0) {
                reason = 'no linked issue';
              } else if (pr.mergeable !== true) {
                reason = 'PR has merge conflicts or mergeability is unknown';
              }

              let review = null;
              let checks = null;
              if (!reason) {
                [review, checks] = await Promise.all([
                  reviewState(pr, labels),
                  checkState(pr),
                ]);
                if (review.budgetExceeded && !labels.has(EXCEEDED_LABEL)) {
                  await addLabel(prNumber, EXCEEDED_LABEL);
                } else if (!review.budgetExceeded && labels.has(EXCEEDED_LABEL)) {
                  await removeLabel(prNumber, EXCEEDED_LABEL);
                }
                if (!review.decision.ready) reason = review.decision.reason;
                else if (!checks.ready) reason = checks.reason;
              }

              const ready = !reason;
              const [latestPr, latestLabels] = await Promise.all([
                getPr(prNumber),
                currentLabels(prNumber),
              ]);
              if (latestPr.head.sha !== pr.head.sha ||
                  latestLabels.has(ACCEPTED_LABEL) !== labels.has(ACCEPTED_LABEL) ||
                  latestLabels.has(EXCEPTION_LABEL) !== labels.has(EXCEPTION_LABEL)) {
                core.info(`PR #${prNumber}: stale evaluation skipped`);
                continue;
              }
              if (ready && !labels.has(READY_LABEL)) await addLabel(prNumber, READY_LABEL);
              if (!ready && labels.has(READY_LABEL)) await removeLabel(prNumber, READY_LABEL);
              await updateReadyComment(latestPr, issueNums, ready, reason);
              core.info(`PR #${prNumber}: ${ready ? 'ready' : `not ready (${reason})`}`);
            }
