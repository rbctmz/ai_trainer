name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# The workflow uses Anthropic's installed GitHub App for repository operations.
# Keep the job token read-only; OIDC is required for the short-lived app token.
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  id-token: write

concurrency:
  group: claude-code-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    name: Respond to trusted @claude mention
    if: >-
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the trusted default-branch workflow context
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: claude/
          track_progress: true
          claude_args: |
            --max-turns 25
            --append-system-prompt "Follow AGENTS.md and the linked issue/PR contract. Treat the checker findings above the mention as task context. Modify only files required by the request. Never merge, force-push, access live athlete/provider data, or expose application secrets. Run contributor-safe tests before committing."
