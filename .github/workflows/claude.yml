name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# The workflow uses Anthropic's installed GitHub App for repository operations.
# Keep the job token read-only; OIDC is required for the short-lived app token.
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  id-token: write

concurrency:
  group: claude-code-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    name: Respond to trusted @claude mention
    if: >-
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the trusted default-branch workflow context
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Verify executable context is repository-owned
        id: executable-context
        uses: actions/github-script@v7
        env:
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        with:
          script: |
            const repository = `${context.repo.owner}/${context.repo.repo}`;

            // A plain issue always starts from the trusted default branch.
            if (
              context.eventName === "issue_comment" &&
              process.env.IS_PULL_REQUEST_COMMENT !== "true"
            ) {
              return true;
            }

            // Review events already carry the PR. Conversation comments only
            // carry a PR link, so resolve their head repository explicitly.
            let pullRequest = context.payload.pull_request;
            if (!pullRequest && process.env.IS_PULL_REQUEST_COMMENT === "true") {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              pullRequest = response.data;
            }

            if (!pullRequest || !pullRequest.head || !pullRequest.head.repo) {
              return false;
            }
            return pullRequest.head.repo.full_name === repository;

      - name: Set up Python 3.11 for contributor-safe tests
        if: steps.executable-context.outputs.result == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install trusted default-branch dependencies
        if: steps.executable-context.outputs.result == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run Claude Code
        if: steps.executable-context.outputs.result == 'true'
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: claude/
          track_progress: true
          claude_args: |
            --max-turns 25
            --allowedTools "Edit,Write,Bash(python -m pytest:*),Bash(python3 -m pytest:*)"
            --append-system-prompt "Follow AGENTS.md and the linked issue/PR contract. Treat the checker findings above the mention as task context. Modify only files required by the request. Never merge, force-push, access live athlete/provider data, or expose application secrets. Run contributor-safe tests before committing."
