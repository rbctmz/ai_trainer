name: Link PR to issue

on:
  pull_request:
    types: [opened, closed]

jobs:
  link:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Update linked issue status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body   = context.payload.pull_request.body || '';
            const action = context.payload.action;
            const merged = context.payload.pull_request.merged;
            const branch = context.payload.pull_request.head.ref || '';

            // Parse Closes/Fixes/Resolves #N from PR body
            const matches = [...body.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/gi)];
            const issueNums = matches.map(m => parseInt(m[1]));

            for (const num of issueNums) {
              if (action === 'opened') {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  labels: ['status: in progress'],
                });
                for (const name of ['status: queued', 'status: blocked']) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: num,
                      name,
                    });
                  } catch {}
                }
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  body: `🔗 PR #${context.payload.pull_request.number} opened — moving to **in progress**.`,
                });

              } else if (action === 'closed' && merged) {
                for (const name of ['status: in progress', 'status: queued', 'status: blocked', 'agent: codex']) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: num,
                      name,
                    });
                  } catch {}
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            }
