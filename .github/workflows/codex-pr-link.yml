name: Link PR to issue

on:
  pull_request:
    types: [opened, edited, synchronize, closed]

jobs:
  link:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Update linked issue status
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';
            const branch = pr.head.ref || '';
            const action = context.payload.action;
            const merged = pr.merged;

            const linkedIssueNums = new Set();
            // Only explicit closing keywords prove that the whole issue is done.
            // A branch marker may identify one milestone of a larger epic.
            const closingIssueNums = new Set();
            for (const match of body.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/gi)) {
              const issueNumber = parseInt(match[1], 10);
              linkedIssueNums.add(issueNumber);
              closingIssueNums.add(issueNumber);
            }
            for (const match of title.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/gi)) {
              const issueNumber = parseInt(match[1], 10);
              linkedIssueNums.add(issueNumber);
              closingIssueNums.add(issueNumber);
            }
            for (const match of branch.matchAll(/(?:^|[\/_-])issue[\/_-]?(\d+)(?:$|[\/_-])/gi)) {
              linkedIssueNums.add(parseInt(match[1], 10));
            }

            if (action === 'opened') {
              for (const num of linkedIssueNums) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  labels: ['status: in progress'],
                });
                for (const name of ['status: queued', 'status: blocked', 'status: needs triage']) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: num,
                      name,
                    });
                  } catch {}
                }
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  body: `🔗 PR #${context.payload.pull_request.number} opened — moving to **in progress**.`,
                });
              }
            } else if (action === 'closed' && merged) {
              for (const num of closingIssueNums) {
                for (const name of ['status: in progress', 'status: queued', 'status: blocked', 'agent: codex']) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: num,
                      name,
                    });
                  } catch {}
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            }
