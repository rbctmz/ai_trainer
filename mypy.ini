# mypy: инкрементальное внедрение проверки типов (измерение, не гейт).
#
# На 2026-09-17 в product-коде 298 ошибок mypy (models 188, api 70, services 32,
# data 8), поэтому по умолчанию проверка выключена: включены только пакеты,
# которые уже проходят чисто. Так `python -m mypy` зелёный и ловит регрессии
# именно в API/service-слое, а не тонет в существующем долге.
#
# Числа, слепые зоны и порядок расширения allowlist:
# docs/code_quality_measurements.md

# python_version = 3.10 — целевой рантайм деплоя (Dockerfile.api: python:3.10-slim)
# и минимум, объявленный в AGENTS.md; ruff.toml целится туда же (py310).
# Проверка на 3.11 сертифицировала бы код, который не импортируется на 3.10.
[mypy]
python_version = 3.10
ignore_missing_imports = True
ignore_errors = True
files = api/routers, services

# --- включено: 48 из 51 файла проходят mypy чисто ---

[mypy-api.routers.*]
ignore_errors = False

[mypy-services.*]
ignore_errors = False

# --- исключения внутри включённых пакетов: существующий долг ---

# `int(params.get("base_checkpoint_id"))` вызывается без guard'а (576, 617), в
# отличие от соседних 605-607/614. Это пробел типизации, а не подтверждённый
# дефект: у предложений, публикуемых циклом, ключ всегда есть
# (api/recovery_replan_loop.py:231). Правка = cast или смена класса ошибки на
# fail-closed, поэтому вынесена за механический срез типов.
[mypy-api.routers.decisions]
ignore_errors = True

[mypy-services.comparable_sessions]
ignore_errors = True

[mypy-services.demo_mode]
ignore_errors = True
