# mypy: инкрементальное внедрение проверки типов (измерение, не гейт).
#
# На 2026-09-17 в product-коде 298 ошибок mypy (models 188, api 70, services 32,
# data 8), поэтому по умолчанию проверка выключена: включены только пакеты,
# которые уже проходят чисто. Так `python -m mypy` зелёный и ловит регрессии
# именно в API/service-слое, а не тонет в существующем долге.
#
# Числа, слепые зоны и порядок расширения allowlist:
# docs/code_quality_measurements.md

[mypy]
python_version = 3.11
ignore_missing_imports = True
ignore_errors = True
files = api/routers, services

# --- включено: 40 из 51 файла проходят mypy чисто ---

[mypy-api.routers.*]
ignore_errors = False

[mypy-services.*]
ignore_errors = False

# --- исключения внутри включённых пакетов: существующий долг ---

[mypy-api.routers.decisions]
ignore_errors = True

[mypy-api.routers.planning]
ignore_errors = True

[mypy-api.routers.session_quality]
ignore_errors = True

[mypy-services.activity_ingest]
ignore_errors = True

[mypy-services.comparable_sessions]
ignore_errors = True

[mypy-services.bike_hr_pairs]
ignore_errors = True

[mypy-services.bike_hr_tss_eval]
ignore_errors = True

[mypy-services.demo_mode]
ignore_errors = True

[mypy-services.planning_onboarding]
ignore_errors = True

[mypy-services.recovery_analytics]
ignore_errors = True

[mypy-services.sync]
ignore_errors = True
